name: Quality and accessibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Type check and build with verified font
        run: npm run build
      - name: Account, ownership and native command contracts
        run: npm test
      - name: Browser journeys and axe accessibility checks
        run: npm run test:ui
      - name: Block high and critical dependency advisories
        run: npm audit --audit-level=high
