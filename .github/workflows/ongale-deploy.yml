# Added by Ongale: every push to main builds this repository and deploys it.
# No Dockerfile needed (Railpack detects the stack); if you add one, it's used instead.
# Deploying needs no stored secret: GitHub's OIDC token proves this repo and branch.
name: Deploy to Ongale

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    # Ongale starts a media-only run after a rollback (STOR-26): it syncs the
    # rolled-back commit's media/ and builds and deploys nothing.
    inputs:
      media_only:
        description: "Only sync media (Ongale runs this after a rollback)"
        type: boolean
        default: false
      commit:
        description: "The commit to sync media from"
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ongale-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Files in media/ (or the folders "media" lists in ongale.json) go to
      # Ongale's CDN, each only once; the build gets ongale-media.json
      # (repository path → URL) and the app MEDIA_URL. Images go as WebP only
      # (STOR-26): the full size plus each width the code mentions (?w=,
      # data-ongale-widths, or "widths" in ongale.json), made here with libvips.
      # A failed sync warns and deploys anyway: the app then serves its own files.
      - name: Sync media to Ongale
        id: media
        run: |
          echo '{}' > ongale-media.json
          python3 - <<'PY' || echo "::warning::Media wasn't synced; the app serves its own files."
          import fnmatch, hashlib, json, os, re, shutil, subprocess, sys, urllib.error, urllib.parse, urllib.request

          API, AUDIENCE = "https://api.ongale.com", "https://api.ongale.com"
          IMAGES = {".png", ".jpg", ".jpeg", ".webp", ".avif"}
          TEXT = {".html", ".htm", ".js", ".mjs", ".jsx", ".ts", ".tsx", ".vue", ".svelte", ".astro", ".css", ".scss",
                  ".md", ".mdx", ".php", ".py", ".rb", ".erb", ".twig", ".liquid", ".hbs", ".ejs", ".njk", ".go", ".tmpl", ".json"}
          SKIP_DIRS = {".git", "node_modules", "vendor", ".venv", "__pycache__"}
          TMP = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "ongale-media")

          # Ongale's API is behind Cloudflare, which refuses Python's default
          # User-Agent ("Python-urllib", error 1010): every request names itself.
          UA = "ongale-deploy-workflow/6"

          def warn(msg, path=None):
              print("::warning%s::%s" % (" file=" + path if path else "", msg))

          def oidc():
              req = urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + AUDIENCE,
                                           headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"], "User-Agent": UA})
              return json.load(urllib.request.urlopen(req, timeout=30))["value"]

          def post(path, body):
              req = urllib.request.Request(API + path, data=json.dumps(body).encode(), method="POST",
                                           headers={"Authorization": "Bearer " + oidc(), "Content-Type": "application/json", "User-Agent": UA})
              try:
                  return json.load(urllib.request.urlopen(req, timeout=300))
              except urllib.error.HTTPError as e:
                  try:
                      msg = json.load(e).get("message", str(e))
                  except Exception:
                      msg = str(e)
                  print("::warning::Media wasn't synced: " + msg)
                  sys.exit(0)

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          try:
              config = json.load(open("ongale.json"))
          except (OSError, ValueError):
              config = {}
          dirs = config.get("media", ["media"])
          files = []
          for d in dirs:
              for root, subdirs, names in os.walk(d):
                  subdirs[:] = sorted(x for x in subdirs if not x.startswith("."))
                  files += [os.path.normpath(os.path.join(root, n)).replace(os.sep, "/") for n in sorted(names) if not n.startswith(".")]
          files = sorted(set(files))
          if not files:
              print("No media folder: nothing to sync.")
              sys.exit(0)
          images = [f for f in files if os.path.splitext(f)[1].lower() in IMAGES]

          # Widths the code mentions, per image: ?w= after its path, and
          # data-ongale-widths on a tag that uses it, in the repository's text files.
          mentioned = {p: set() for p in images}
          spellings = {p: {p, urllib.parse.quote(p)} for p in images}
          for root, subdirs, names in os.walk("."):
              subdirs[:] = [x for x in subdirs if x not in SKIP_DIRS]
              for n in names:
                  f = os.path.join(root, n)
                  if os.path.splitext(n)[1].lower() not in TEXT or os.path.getsize(f) > 2 << 20:
                      continue
                  try:
                      text = open(f, encoding="utf-8", errors="ignore").read()
                  except OSError:
                      continue
                  for p in images:
                      for sp in spellings[p]:
                          if sp not in text:
                              continue
                          for m in re.finditer(re.escape(sp) + r"\?(?:[^\"'\s<>]*&)?w=(\d{1,5})", text):
                              mentioned[p].add(int(m.group(1)))
                          for tag in re.finditer(r"<[^<>]*" + re.escape(sp) + r"[^<>]*>", text):
                              ws = re.search(r"data-ongale-widths\s*=\s*[\"']([\d,\s]+)[\"']", tag.group(0))
                              if ws:
                                  mentioned[p].update(int(x) for x in re.findall(r"\d+", ws.group(1)))
          for pattern, ws in (config.get("widths") or {}).items():
              for p in images:
                  if fnmatch.fnmatch(p, pattern):
                      mentioned[p].update(int(w) for w in ws)

          # libvips makes the WebP versions; without it, images go as they are.
          vips = os.environ.get("ONGALE_VIPS", shutil.which("vips") or "")  # tests set it ("" = none)
          if images and not vips and os.environ.get("GITHUB_ACTIONS") == "true":
              subprocess.run("sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libvips-tools",
                             shell=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              vips = shutil.which("vips")
          if images and not vips:
              warn("libvips isn't available: images are uploaded as they are, not as WebP")

          def convert(src, out, width):
              # thumbnail: auto-rotated, never enlarged; strip drops metadata (EXIF, GPS).
              subprocess.run([vips, "thumbnail", src, out + "[Q=82,strip]", str(width), "--height", "100000", "--size", "down"],
                             check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              header = subprocess.run([vips + "header", "-f", "width", out], capture_output=True, text=True, check=True).stdout
              height = subprocess.run([vips + "header", "-f", "height", out], capture_output=True, text=True, check=True).stdout
              return int(header), int(height)

          entries, local = [], {}
          for p in files:
              e = {"path": p, "sha256": sha256(p), "size": os.path.getsize(p)}
              if vips and p in mentioned and os.path.splitext(p)[1].lower() in IMAGES:
                  try:
                      base = os.path.join(TMP, e["sha256"])
                      os.makedirs(base, exist_ok=True)
                      full = os.path.join(base, "w0.webp")
                      width, height = convert(p, full, 100000)
                      versions = [{"width": 0, "size": os.path.getsize(full)}]
                      local[(p, 0)] = full
                      for w in sorted(x for x in mentioned[p] if 0 < x < width):
                          out = os.path.join(base, "w%d.webp" % w)
                          convert(p, out, w)
                          versions.append({"width": w, "size": os.path.getsize(out)})
                          local[(p, w)] = out
                      e.update(width=width, height=height, versions=versions)
                  except (subprocess.CalledProcessError, ValueError) as err:
                      warn("couldn't convert to WebP, uploaded as it is: %s" % getattr(err, "stderr", err), p)
              entries.append(e)

          plan = post("/v1/github/media-syncs", {"files": entries})
          for s in plan.get("skipped", []):
              warn("Not synced: " + s["reason"], s["path"])
          for u in plan.get("uploads", []):
              src = local.get((u["path"], u["width"])) if "width" in u else u["path"]
              headers = dict(u["upload"]["headers"], **{"Content-Length": str(os.path.getsize(src)), "User-Agent": UA})
              with open(src, "rb") as body:
                  req = urllib.request.Request(u["upload"]["url"], data=body, method="PUT", headers=headers)
                  try:
                      urllib.request.urlopen(req, timeout=600)
                  except urllib.error.URLError as err:
                      warn("Upload failed: %s" % err, u["path"])
          done = post("/v1/github/media-syncs/%s/complete" % plan["sync_id"], {})
          for f in done.get("failed", []):
              warn("Not synced: " + f["reason"], f["path"])
          json.dump(done["manifest"], open("ongale-media.json", "w"), indent=1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("sync=%s\n" % plan["sync_id"])
          webp = sum(1 for e in entries if "versions" in e)
          print("Synced %d media files (%d images as WebP); the app reads them through ongale-media.json." % (len(done["manifest"]), webp))
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ !inputs.media_only }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: ${{ !inputs.media_only }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan the build with Railpack
        if: ${{ !inputs.media_only && hashFiles('Dockerfile') == '' }}
        run: |
          # Railpack keeps its cache in /tmp/railpack, so the CLI lives elsewhere.
          mkdir -p "$RUNNER_TEMP/railpack-cli"
          curl -fsSL -o "$RUNNER_TEMP/railpack.tgz" https://github.com/railwayapp/railpack/releases/download/v0.43.0/railpack-v0.43.0-x86_64-unknown-linux-musl.tar.gz
          echo "248a8f60f36854aabed6124113631078a802de3461660855fc4de9c26065c1fb  $RUNNER_TEMP/railpack.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/railpack.tgz" -C "$RUNNER_TEMP/railpack-cli" railpack
          "$RUNNER_TEMP/railpack-cli/railpack" prepare . --plan-out /tmp/railpack-plan.json --info-out /tmp/railpack-info.json

      - name: Build with the Dockerfile
        id: dockerfile
        if: ${{ !inputs.media_only && hashFiles('Dockerfile') != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Build with Railpack
        id: railpack
        if: ${{ !inputs.media_only && hashFiles('Dockerfile') == '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: /tmp/railpack-plan.json
          build-args: BUILDKIT_SYNTAX=ghcr.io/railwayapp/railpack-frontend:v0.43.0@sha256:355ef61fae6f2551103cd8b10c710cb07167dd353d561f15c69b8d7ac1c676cc
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      # This job's GITHUB_TOKEN lets Ongale pull a private image once; it stops
      # working when the job ends, so the step waits until the image is pulled.
      - name: Deploy to Ongale
        if: ${{ !inputs.media_only }}
        env:
          DIGEST: ${{ steps.dockerfile.outputs.digest || steps.railpack.outputs.digest }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_SYNC: ${{ steps.media.outputs.sync }}
        run: |
          oidc() {
            curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.ongale.com" | jq -r .value
          }
          # Every app this branch deploys gets the image (a web app, a worker, a cron job…).
          ANSWER=$(jq -n --arg d "$DIGEST" --arg t "$REGISTRY_TOKEN" --arg m "$MEDIA_SYNC" '{digest: $d, registry_token: $t, media_sync: $m, workflow_version: 6}' |
            curl -sS --fail-with-body -X POST "https://api.ongale.com/v1/github/deploys" \
              -H "Authorization: Bearer $(oidc)" -H "Content-Type: application/json" -d @-)
          echo "$ANSWER" | jq -r '.skipped[]? | "::warning::App \(.app_id) was not deployed: \(.reason)"'
          FAILED=0
          for RELEASE in $(echo "$ANSWER" | jq -r '(.releases // [.release])[]'); do
            STATUS=pulling
            for _ in $(seq 1 120); do
              STATUS=$(curl -fsS "https://api.ongale.com/v1/github/deploys/$RELEASE" -H "Authorization: Bearer $(oidc)" | jq -r .status || true)
              [ "$STATUS" = pulled ] || [ "$STATUS" = failed ] && break
              sleep 5
            done
            case "$STATUS" in
              pulled) echo "Ongale pulled the image for release $RELEASE; the rest of the deploy shows on the app page." ;;
              failed) echo "::error::A deploy stopped (release $RELEASE). The app page in Ongale says why."; FAILED=1 ;;
              *) echo "::warning::Ongale hasn't pulled the image for release $RELEASE after 10 minutes; check the app page." ;;
            esac
          done
          exit $FAILED
