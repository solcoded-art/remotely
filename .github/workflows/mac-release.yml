# The Mac installer is independent of Ongale's Linux web deployment.
# From 0.4.0 the Mac app is the native GPUI build in desktop-gpui/ (it replaces
# the Electron app: same name, bundle identifier and download channel).
name: Publish Mac installer
on:
  push:
    tags: ['mac-v*']
permissions:
  contents: write
concurrency:
  group: mac-installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate release version and architecture
        run: |
          test "$(uname -m)" = arm64
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop-gpui/Cargo.toml | head -1)
          export CARGO_VERSION
          node -e "const a=require('./release.config.json'),p=require('./package.json'); if(a.version!==p.version || a.version!==process.env.CARGO_VERSION || process.env.GITHUB_REF_NAME!=='mac-v'+p.version || !a.url.endsWith('/mac-v'+a.version+'/MacRemote-'+a.version+'-mac-arm64.zip')) process.exit(1)"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: Unit tests
        # The hardware H.264 encoder may be unavailable in CI virtual machines.
        run: cd desktop-gpui && cargo test --locked -- --skip encoder::tests::encodes_h264_with_parameter_sets
      - name: Build and sign the Apple Silicon app
        run: desktop-gpui/scripts/package-mac.sh
      - name: Checksum
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd desktop-gpui/target/dist
          shasum -a 256 "MacRemote-${VERSION}-mac-arm64.zip" > SHA256SUMS
      - name: Verify the extracted release archive
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ditto -x -k "desktop-gpui/target/dist/MacRemote-${VERSION}-mac-arm64.zip" "$RUNNER_TEMP/mac-archive-check"
          APP="$RUNNER_TEMP/mac-archive-check/Mac Remote.app"
          codesign --verify --deep --strict "$APP"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = com.macremote.companion
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(lipo -archs "$APP/Contents/MacOS/Mac Remote")" = arm64
          test -x "$APP/Contents/Resources/mac_driver"
          # A test-only build must never ship.
          ! grep -aq MAC_REMOTE_E2E "$APP/Contents/MacOS/Mac Remote"
      - name: Publish developer beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "$GITHUB_REF_NAME" "desktop-gpui/target/dist/MacRemote-${VERSION}-mac-arm64.zip" desktop-gpui/target/dist/SHA256SUMS --verify-tag --prerelease --title "Mac Remote ${VERSION} developer beta" --notes-file docs/mac-release-notes.md
