# Local development only. Ongale supplies its own PostgreSQL through DATABASE_URL.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: remote
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: mac_remote
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - remote-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U remote -d mac_remote"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  remote-db:
