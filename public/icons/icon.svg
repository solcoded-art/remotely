<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#5e5ce6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Accent Glow -->
  <circle cx="256" cy="230" r="130" fill="url(#accentGrad)" opacity="0.25" filter="url(#glow)"/>

  <!-- Mac Screen Frame -->
  <rect x="96" y="110" width="320" height="210" rx="20" fill="#161618" stroke="url(#accentGrad)" stroke-width="8"/>
  <!-- Screen Glass Area -->
  <rect x="110" y="124" width="292" height="182" rx="12" fill="#000000"/>

  <!-- Mini Screen Elements -->
  <circle cx="128" cy="140" r="4" fill="#ff453a"/>
  <circle cx="140" cy="140" r="4" fill="#ffd60a"/>
  <circle cx="152" cy="140" r="4" fill="#30d158"/>

  <!-- Phone / Remote Silhouette overlay -->
  <rect x="290" y="220" width="130" height="220" rx="26" fill="#1c1c1e" stroke="#0a84ff" stroke-width="6"/>
  <rect x="302" y="244" width="106" height="166" rx="16" fill="#000000"/>
  <circle cx="355" cy="233" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- Signal Waves from Phone to Mac -->
  <path d="M250 260 A 40 40 0 0 0 250 310" fill="none" stroke="#0a84ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M230 245 A 60 60 0 0 0 230 325" fill="none" stroke="#5e5ce6" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Stand of Mac -->
  <path d="M216 320 L296 320 L306 370 L206 370 Z" fill="#2c2c2e"/>
  <rect x="180" y="370" width="152" height="12" rx="6" fill="#3a3a3c"/>
</svg>
